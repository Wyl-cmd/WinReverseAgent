name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev --extra reverse

      # Windows 专用逆向依赖：CI 跑在 windows-latest，需装入 vendor 内的 win_amd64 轮子
      # 2026-09-15 修复：此前仅 --group dev，yara/pymem/die/capstone/pefile/dearpygui 缺失
      # → 55 个 collection error，Unit tests 步骤必失败
      - name: Install vendor wheels (Windows reverse deps)
        shell: bash
        run: |
          for w in vendor/wheels/*.whl; do
            uv pip install --python .venv/Scripts/python.exe "$w"
          done

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff format, 替代 black)
        run: uv run --no-sync ruff format --check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy src/winreverse

      # 注：import 排序由 ruff 内置的 I 规则统一检查，不再使用独立 isort

      - name: Unit tests
        run: uv run --no-sync pytest tests/unit -q --tb=short -m "not live"
        env:
          WINREVERSE_TEST_MODE: "ci"
