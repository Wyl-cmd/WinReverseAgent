[project]
name = "kosong"
version = "2.0.0"
description = "LLM Abstraction Layer with Descriptor-First Provider Architecture（从 KXNS 复用）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "openai>=1.40",
    "tiktoken>=0.6",
    "toml>=0.10",
    "anthropic>=0.78.0",
    "typing_extensions>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosong"]
